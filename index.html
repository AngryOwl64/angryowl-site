<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bow Clan Mitglieder</title>
</head>
<body>

<h2>Owner</h2>
<ul id="owner"></ul>

<h2>Admin</h2>
<ul id="admin"></ul>

<h2>Mods (<span id="modCount"></span>)</h2>
<ul id="mods"></ul>

<h2>Member (<span id="memberCount"></span>)</h2>
<ul id="members"></ul>

<script>
async function loadMembers() {
    const url = "https://gomme-clan-members.dodo1213.de/members?clan=bow";

    const response = await fetch(url);
    const data = await response.json();

    // Owner
    const ownerList = document.getElementById("owner");
    data["Eigentuemer"].forEach(owner => {
        const li = document.createElement("li");
        li.textContent = owner;
        ownerList.appendChild(li);
    });

    // Admin
    const adminList = document.getElementById("admin");
    data["Administratoren"].forEach(admin => {
        const li = document.createElement("li");
        li.textContent = admin;
        adminList.appendChild(li);
    });

    // Mods
    document.getElementById("modCount").textContent = data["Moderatoren"].length;
    const modList = document.getElementById("mods");
    data["Moderatoren"].forEach(mod => {
        const li = document.createElement("li");
        li.textContent = mod;
        modList.appendChild(li);
    });

    // Members
    document.getElementById("memberCount").textContent = data["Mitglieder"].length;
    const memberList = document.getElementById("members");
    data["Mitglieder"].forEach(member => {
        const li = document.createElement("li");
        li.textContent = member;
        memberList.appendChild(li);
    });
}

loadMembers();
</script>

</body>
</html>
